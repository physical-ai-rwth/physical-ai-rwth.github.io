<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ page.description | default: site.description }}">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

<!-- Preload critical fonts (latin variable cuts + Vollkorn display weight) -->
<link rel="preload" href="{{ "/assets/fonts/roboto/Roboto.latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ "/assets/fonts/roboto-mono/RobotoMono.latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ "/assets/fonts/vollkorn/Vollkorn-Black.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>

<!-- Favicon: robot emoji rendered to real bitmaps (works in Safari too) -->
<link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/images/favicon/favicon-32.png" | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/images/favicon/favicon-16.png" | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/images/favicon/favicon-180.png" | relative_url }}">

<link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">

<!-- Scroll-reveal starts hidden and is shown by JS; without JS it must never stay invisible -->
<noscript>
  <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
</noscript>

{% seo %}
